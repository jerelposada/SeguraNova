<section class="dashboard" data-testid="admin-dashboard">
	<header class="dashboard__header">
		<p class="dashboard__eyebrow">Admin / Gobierno</p>
		<h2 class="dashboard__title">Dashboard de administracion y monitoreo</h2>
		<p class="dashboard__status">{{ operationalStatus() }}</p>
	</header>

	<div class="dashboard__kpis">
		@for (kpi of kpis(); track kpi.label) {
			<article class="dashboard__kpi-card" data-testid="dashboard-kpi-card">
				<p class="dashboard__kpi-label">{{ kpi.label }}</p>
				<p class="dashboard__kpi-value">{{ kpi.value }}</p>
				<p class="dashboard__kpi-trend">{{ kpi.trend }}</p>
			</article>
		}
	</div>

	<div class="dashboard__sections">
		<app-usuarios-roles />
		<app-knowledge-bases />
		<app-metricas-uso />
		<app-audit-log />
	</div>
</section>
