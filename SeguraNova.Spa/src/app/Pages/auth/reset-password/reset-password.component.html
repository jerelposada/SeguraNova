<main aria-label="Restablecer contraseña">
  <section>
    <h1>Restablecer contraseña</h1>
    <p>Ingresa tu nueva contraseña para completar el proceso.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <label for="newPassword">Nueva contraseña</label>
      <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />

      <label for="confirmPassword">Confirmar contraseña</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />

      @if (form.touched && form.hasError('passwordMismatch')) {
        <p role="alert">Las contraseñas no coinciden.</p>
      }

      <button type="submit" [disabled]="isSubmitting()">Restablecer contraseña</button>
    </form>

    @if (successMessage()) {
      <p role="status">{{ successMessage() }}</p>
    }

    @if (errorMessage()) {
      <p role="alert">{{ errorMessage() }}</p>
    }
  </section>
</main>
