<div class="admin-layout" [class.is-mobile]="isMobile()">
  <header class="admin-topbar" role="banner" data-testid="admin-topbar">
    <div class="topbar-inner">
      <div class="brand">SeguraNova</div>
      <div class="topbar-actions">Panel administrativo</div>
    </div>
  </header>

  <div class="admin-body">
    <aside class="admin-sidebar" role="navigation" aria-label="Admin navigation" data-testid="admin-sidebar">
      <nav>
        <ul class="admin-nav-list">
          <li *ngFor="let item of navItems()" class="admin-nav-item">
            <a [routerLink]="item.route" routerLinkActive="admin-nav-link--active" [routerLinkActiveOptions]="{exact:true}" class="admin-nav-link">
              <span class="admin-nav-icon" aria-hidden="true">{{ item.icon }}</span>
              <span class="admin-nav-label">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <main class="admin-main" role="main" data-testid="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
